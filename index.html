<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Your Prompt</title>
    
    <!-- Tailwind CSS para estilização rápida e responsiva -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Phosphor Icons para o ícone de copiar e enviar -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <!-- Configuração de fontes e animações personalizadas -->
    <style>
        @font-face {
            font-family: 'Samsung Sans';
            /* Tentativa de carregar a fonte localmente caso o usuário tenha, com fallback para fontes limpas */
            src: local('Samsung Sans'), local('SamsungSans-Bold');
            font-weight: bold;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f172a; /* bg-slate-900 */
            color: #f8fafc; /* text-slate-50 */
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        .font-samsung {
            font-family: 'Samsung Sans', 'Inter', sans-serif;
            font-weight: 700;
        }

        /* Animação suave para revelar elementos */
        .fade-in {
            animation: fadeIn 0.5s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Efeito glassmorphism para o embed */
        .glass-embed {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }

        /* Botão com Blur (Esfumaçado) */
        .btn-blur {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            transition: all 0.3s ease;
        }

        .btn-blur:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.3);
        }

        /* Loader */
        .loader {
            border: 3px solid rgba(255,255,255,0.1);
            border-radius: 50%;
            border-top: 3px solid #3b82f6; /* blue-500 */
            width: 24px;
            height: 24px;
            -webkit-animation: spin 1s linear infinite; /* Safari */
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Animação para o dropdown */
        .dropdown-enter {
            animation: dropdownFadeIn 0.2s ease-out forwards;
        }
        @keyframes dropdownFadeIn {
            from { opacity: 0; transform: translateY(10px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 antialiased selection:bg-blue-500 selection:text-white">

    <!-- Header com a Logo e Nome -->
    <header class="w-full p-6 flex items-center justify-start max-w-6xl mx-auto absolute top-0 left-0 right-0 z-10">
        <div class="flex items-center gap-3 cursor-pointer">
            <img src="Gemini_Generated_Image_d36l7id36l7id36l-removebg-preview.png" alt="Create Your Prompt Logo" class="h-12 w-12 object-contain drop-shadow-lg">
            <h1 class="font-samsung text-2xl tracking-wide text-white">Create Your Prompt</h1>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="flex-grow flex flex-col items-center justify-center px-4 pt-24 pb-12 w-full max-w-4xl mx-auto relative">
        
        <!-- Background Gradient Decorativo -->
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-blue-600/20 rounded-full blur-[100px] -z-10 pointer-events-none"></div>

        <!-- Seção Hero & Chat -->
        <div id="heroSection" class="w-full flex flex-col items-center text-center transition-all duration-500 mt-16">
            <h2 class="text-4xl md:text-5xl font-bold mb-4 text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-400">
                O que você deseja criar hoje?
            </h2>
            <p class="text-slate-400 text-lg mb-10 max-w-2xl">
                Descreva a sua ideia em poucas palavras e nossa IA estruturará o prompt perfeito para você usar em qualquer ferramenta.
            </p>

            <!-- Chat Input -->
            <form id="promptForm" class="w-full relative group">
                <div class="absolute inset-0 bg-gradient-to-r from-blue-500 to-purple-500 rounded-2xl blur opacity-25 group-hover:opacity-40 transition duration-300"></div>
                <div class="relative flex flex-col bg-slate-800 border border-slate-700 rounded-2xl shadow-xl focus-within:border-blue-500 focus-within:ring-1 focus-within:ring-blue-500 transition-all">
                    
                    <textarea 
                        id="userInput" 
                        rows="2" 
                        class="w-full bg-transparent text-slate-100 p-5 pb-16 outline-none resize-none placeholder-slate-500"
                        placeholder="Ex: Quero um prompt para o Midjourney criar um lobo cibernético em neon..."
                        required></textarea>
                    
                    <!-- Botões Inferiores do Chat -->
                    <div class="absolute bottom-2 left-3 flex items-center">
                        <div class="relative">
                            <!-- Botão Seletor de Modelo -->
                            <button type="button" id="modelSelectBtn" class="flex items-center gap-1.5 text-sm font-medium text-slate-300 hover:text-white transition-colors bg-slate-700/40 hover:bg-slate-700/80 px-3 py-1.5 rounded-xl border border-slate-600/50">
                                <span id="currentModelText">Flash 1.0</span>
                                <img src="Captura de Tela 2026-07-29 às 15.38.07.png" alt="Seta" class="w-3 h-3 opacity-80 invert">
                            </button>

                            <!-- Dropdown de Modelos -->
                            <div id="modelDropdown" class="hidden absolute bottom-full left-0 mb-3 w-72 bg-slate-800 border border-slate-600 rounded-xl shadow-2xl z-50 overflow-hidden flex-col dropdown-enter">
                                <!-- Modelos Gratuitos -->
                                <div class="p-2">
                                    <h3 class="text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-1 px-2">Gratuita</h3>
                                    <button type="button" class="model-option w-full text-left px-3 py-2 rounded-lg hover:bg-slate-700 transition flex flex-col mb-1" data-model="Flash Lite 1.0">
                                        <span class="text-sm font-medium text-slate-200">Flash Lite 1.0</span>
                                        <span class="text-xs text-slate-400">Mais rápido, ideal para tarefas simples.</span>
                                    </button>
                                    <button type="button" class="model-option w-full text-left px-3 py-2 rounded-lg hover:bg-slate-700 transition flex flex-col bg-slate-700/50" data-model="Flash 1.0">
                                        <span class="text-sm font-medium text-slate-200">Flash 1.0</span>
                                        <span class="text-xs text-slate-400">Equilibrado. Padrão para a maioria das tarefas.</span>
                                    </button>
                                </div>
                                <!-- Modelos Pagos -->
                                <div class="p-2 border-t border-slate-700 bg-slate-900/50">
                                    <div class="flex justify-between items-center mb-1 px-2">
                                        <h3 class="text-[11px] font-bold text-purple-400 uppercase tracking-wider">Paga</h3>
                                        <span id="premiumStatus" class="text-[10px] font-bold bg-purple-500/20 text-purple-300 px-2 py-0.5 rounded-full shadow-inner">4 usos grátis</span>
                                    </div>
                                    <button type="button" class="model-option w-full text-left px-3 py-2 rounded-lg hover:bg-slate-700 transition flex flex-col relative mb-1" data-model="Pro" data-premium="true">
                                        <div class="flex justify-between items-center w-full">
                                            <span class="text-sm font-medium text-purple-300">Pro</span>
                                            <span class="text-xs font-semibold text-slate-400">R$ 16,50/mês</span>
                                        </div>
                                        <span class="text-xs text-slate-400 mt-0.5">Raciocínio avançado e análise complexa.</span>
                                    </button>
                                    <button type="button" class="model-option w-full text-left px-3 py-2 rounded-lg hover:bg-slate-700 transition flex flex-col relative" data-model="Ultra" data-premium="true">
                                        <div class="flex justify-between items-center w-full">
                                            <span class="text-sm font-medium text-purple-300">Ultra</span>
                                            <span class="text-xs font-semibold text-slate-400">R$ 23,90/mês</span>
                                        </div>
                                        <span class="text-xs text-slate-400 mt-0.5">Desempenho máximo para tarefas exigentes.</span>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <button type="submit" id="submitBtn" class="absolute right-3 bottom-3 p-3 bg-blue-600 hover:bg-blue-500 text-white rounded-xl transition-colors flex items-center justify-center shadow-lg z-10">
                        <i class="ph ph-paper-plane-right text-xl"></i>
                    </button>
                </div>
            </form>
        </div>

        <!-- Seção de Resultado (Embed) -->
        <div id="resultSection" class="w-full mt-12 hidden opacity-0 flex-col items-center">
            
            <div class="w-full text-left mb-3 pl-2 flex items-center gap-2">
                <i class="ph ph-sparkle text-blue-400 text-xl"></i>
                <span class="text-slate-300 font-medium">Seu prompt está pronto:</span>
            </div>

            <!-- Embed Card -->
            <div class="glass-embed rounded-2xl w-full p-6 relative group overflow-hidden">
                <p id="generatedText" class="text-slate-200 text-lg leading-relaxed font-light whitespace-pre-wrap pb-12"></p>
                
                <!-- Botão de Copiar com Blur (Canto Direito Inferior) -->
                <button id="copyBtn" class="btn-blur absolute bottom-4 right-4 flex items-center gap-2 px-4 py-2 rounded-xl text-white font-medium text-sm z-10">
                    <i class="ph ph-copy text-lg" id="copyIcon"></i>
                    <span id="copyText">Copiar</span>
                </button>
            </div>
            
            <button id="resetBtn" class="mt-8 text-slate-400 hover:text-white transition-colors underline underline-offset-4 decoration-slate-600 hover:decoration-blue-400">
                Criar novo prompt
            </button>
        </div>

        <!-- Indicador de Carregamento -->
        <div id="loadingState" class="hidden mt-12 flex-col items-center gap-4">
            <div class="loader"></div>
            <p class="text-blue-400 animate-pulse">Engenharia de prompt em andamento...</p>
        </div>

    </main>

    <script>
        // Elementos do DOM
        const form = document.getElementById('promptForm');
        const input = document.getElementById('userInput');
        const submitBtn = document.getElementById('submitBtn');
        const loadingState = document.getElementById('loadingState');
        const resultSection = document.getElementById('resultSection');
        const generatedText = document.getElementById('generatedText');
        const copyBtn = document.getElementById('copyBtn');
        const copyIcon = document.getElementById('copyIcon');
        const copyText = document.getElementById('copyText');
        const resetBtn = document.getElementById('resetBtn');
        const heroSection = document.getElementById('heroSection');

        // Elementos de Modelo (IA)
        const modelSelectBtn = document.getElementById('modelSelectBtn');
        const modelDropdown = document.getElementById('modelDropdown');
        const currentModelText = document.getElementById('currentModelText');
        const modelOptions = document.querySelectorAll('.model-option');
        const premiumStatusBadge = document.getElementById('premiumStatus');

        // Configuração da API do Gemini
        const apiKey = ""; // A chave é injetada automaticamente pelo ambiente
        const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

        // Prompt de Sistema para definir o comportamento da IA
        const systemInstruction = `
            Você é um Engenheiro de Prompts Especialista (Master Prompt Engineer).
            O usuário vai descrever de forma simples o que ele deseja (pode ser uma imagem, um texto, um código, etc).
            Sua função é pegar essa descrição simples e criar o PROMPT PERFEITO, detalhado, estruturado e otimizado para que o usuário possa copiar e colar na IA alvo (como ChatGPT, Midjourney, Claude, etc).
            
            Regras absolutas:
            1. Retorne APENAS o prompt final pronto para ser copiado.
            2. NÃO inclua saudações, explicações, ou aspas no início/fim.
            3. Não diga "Aqui está o seu prompt". Vá direto ao texto do prompt.
        `;

        // Sistema de Controle de Modelos Premium
        let currentModel = 'Flash 1.0';
        let isPremiumSelected = false;
        const PREMIUM_LIMIT = 4;
        const COOLDOWN_MS = 3 * 24 * 60 * 60 * 1000; // 3 dias em milissegundos

        // Carregar estado do localStorage
        let premiumUses = parseInt(localStorage.getItem('createPrompt_premiumUses') || '0');
        let premiumCooldown = parseInt(localStorage.getItem('createPrompt_premiumCooldown') || '0');

        function updatePremiumStatusUI() {
            const now = Date.now();
            
            // Verifica se o tempo de espera (cooldown) acabou
            if (premiumCooldown > 0 && now >= premiumCooldown) {
                premiumUses = 0;
                premiumCooldown = 0;
                localStorage.setItem('createPrompt_premiumUses', '0');
                localStorage.setItem('createPrompt_premiumCooldown', '0');
            }

            // Atualiza a interface
            if (premiumCooldown > 0 && now < premiumCooldown) {
                const hoursLeft = Math.ceil((premiumCooldown - now) / (1000 * 60 * 60));
                const daysLeft = Math.ceil(hoursLeft / 24);
                
                premiumStatusBadge.textContent = `Aguarde ${daysLeft} dia${daysLeft > 1 ? 's' : ''}`;
                premiumStatusBadge.classList.replace('text-purple-300', 'text-red-300');
                premiumStatusBadge.classList.replace('bg-purple-500/20', 'bg-red-500/20');
            } else {
                const remaining = Math.max(0, PREMIUM_LIMIT - premiumUses);
                premiumStatusBadge.textContent = `${remaining} uso${remaining !== 1 ? 's' : ''} grátis`;
                premiumStatusBadge.classList.replace('text-red-300', 'text-purple-300');
                premiumStatusBadge.classList.replace('bg-red-500/20', 'bg-purple-500/20');
            }
        }

        // Toggle do Dropdown de Modelos
        modelSelectBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            updatePremiumStatusUI();
            modelDropdown.classList.toggle('hidden');
            modelDropdown.classList.toggle('flex');
        });

        // Fechar dropdown ao clicar fora
        document.addEventListener('click', (e) => {
            if (!modelSelectBtn.contains(e.target) && !modelDropdown.contains(e.target)) {
                modelDropdown.classList.add('hidden');
                modelDropdown.classList.remove('flex');
            }
        });

        // Selecionar Modelo
        modelOptions.forEach(option => {
            option.addEventListener('click', () => {
                const selectedModel = option.getAttribute('data-model');
                isPremiumSelected = option.getAttribute('data-premium') === 'true';
                
                currentModel = selectedModel;
                currentModelText.textContent = selectedModel;
                
                // Estilo visual da seleção
                modelOptions.forEach(opt => opt.classList.remove('bg-slate-700/50'));
                option.classList.add('bg-slate-700/50');

                // Ajusta cor do texto do botão com base se é premium
                if (isPremiumSelected) {
                    currentModelText.classList.add('text-purple-300');
                    currentModelText.classList.remove('text-slate-300');
                } else {
                    currentModelText.classList.add('text-slate-300');
                    currentModelText.classList.remove('text-purple-300');
                }

                modelDropdown.classList.add('hidden');
                modelDropdown.classList.remove('flex');
            });
        });

        // Inicializa o status
        updatePremiumStatusUI();

        // Ajustar altura do textarea automaticamente
        input.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
            if (this.value === '') {
                this.style.height = 'auto';
            }
        });

        // Submeter com Enter e quebrar linha com Shift+Enter
        input.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault(); // Evita a quebra de linha padrão do Enter
                if (input.value.trim() !== '') {
                    form.requestSubmit(); // Dispara o evento de submit do formulário
                }
            }
        });

        // Evento de Envio do Formulário
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const query = input.value.trim();
            if (!query) return;

            // Validação Premium antes de gerar
            if (isPremiumSelected) {
                const now = Date.now();
                updatePremiumStatusUI(); // Garante estado atualizado
                
                if (premiumCooldown > 0 && now < premiumCooldown) {
                    alert("Você já usou seus 4 prompts Premium gratuitos. Assine o plano ou aguarde o fim do período de 3 dias para tentar novamente gratuitamente.");
                    return;
                }
            }

            // UI Updates: Loading
            form.querySelector('button[type="submit"]').disabled = true;
            form.querySelector('button[type="submit"]').innerHTML = '<div class="loader" style="width:18px;height:18px;border-top-color:#fff;"></div>';
            
            try {
                const payload = {
                    contents: [{ parts: [{ text: query }] }],
                    systemInstruction: { parts: [{ text: systemInstruction }] },
                };

                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    throw new Error('Falha na comunicação com a IA.');
                }

                const result = await response.json();
                const candidate = result.candidates?.[0];

                if (candidate && candidate.content?.parts?.[0]?.text) {
                    const finalPrompt = candidate.content.parts[0].text.trim();
                    
                    // Exibir o resultado
                    generatedText.textContent = finalPrompt;
                    loadingState.classList.add('hidden');
                    loadingState.classList.remove('flex');
                    
                    resultSection.classList.remove('hidden');
                    resultSection.classList.add('flex', 'fade-in');

                    // Descontar uso premium com sucesso
                    if (isPremiumSelected) {
                        premiumUses++;
                        localStorage.setItem('createPrompt_premiumUses', premiumUses.toString());
                        
                        if (premiumUses >= PREMIUM_LIMIT) {
                            premiumCooldown = Date.now() + COOLDOWN_MS;
                            localStorage.setItem('createPrompt_premiumCooldown', premiumCooldown.toString());
                        }
                        updatePremiumStatusUI();
                    }

                } else {
                    throw new Error('A IA não retornou um formato esperado.');
                }

            } catch (error) {
                console.error(error);
                alert("Ocorreu um erro ao gerar o prompt. Tente novamente.");
                loadingState.classList.add('hidden');
                loadingState.classList.remove('flex');
            } finally {
                form.querySelector('button[type="submit"]').disabled = false;
                form.querySelector('button[type="submit"]').innerHTML = '<i class="ph ph-paper-plane-right text-xl"></i>';
            }
        });

        // Função para Copiar o Texto
        copyBtn.addEventListener('click', () => {
            const textToCopy = generatedText.textContent;
            try {
                // Utilizando document.execCommand('copy') devido a restrições de iFrame (Ambiente seguro)
                const textArea = document.createElement("textarea");
                textArea.value = textToCopy;
                
                // Esconde o textarea da tela
                textArea.style.position = "fixed";
                textArea.style.left = "-999999px";
                textArea.style.top = "-999999px";
                
                document.body.appendChild(textArea);
                textArea.focus();
                textArea.select();
                
                // Executa a cópia nativa
                const successful = document.execCommand('copy');
                textArea.remove(); // Limpa o elemento

                if (successful) {
                    // Feedback visual de sucesso
                    copyIcon.classList.remove('ph-copy');
                    copyIcon.classList.add('ph-check', 'text-green-400');
                    copyText.textContent = 'Copiado!';
                    copyBtn.classList.add('border-green-400/50');
                    
                    // Retornar ao estado normal após 2 segundos
                    setTimeout(() => {
                        copyIcon.classList.remove('ph-check', 'text-green-400');
                        copyIcon.classList.add('ph-copy');
                        copyText.textContent = 'Copiar';
                        copyBtn.classList.remove('border-green-400/50');
                    }, 2000);
                } else {
                    console.error('O navegador recusou o comando de cópia.');
                }
                
            } catch (err) {
                console.error('Falha ao copiar: ', err);
            }
        });

        // Resetar para novo prompt
        resetBtn.addEventListener('click', () => {
            input.value = '';
            input.style.height = 'auto';
            resultSection.classList.add('hidden');
            resultSection.classList.remove('fade-in');
            heroSection.classList.remove('-translate-y-4');
            input.focus();
        });

        // Foco inicial
        window.onload = () => {
            input.focus();
        }
    </script>
</body>
</html>
